"""
`inbound_address.kind`, exposed over GraphQL.
"""
enum AddressKindType {
	EXACT
	WILDCARD
}

"""
An `inbound_address` row, exposed over GraphQL. Only reachable through
`Instance.inboundAddresses`, which is owner-guarded — see that field's doc
comment.
"""
type InboundAddressInfo {
	address: String!
	kind: AddressKindType!
	createdAt: Int!
}

type Instance {
	id: ID!
	name: String!
	slug: String!
	publicSubmissionEnabled: Boolean!
	fromName: String!
	signature: String!
	createdAt: Int!
	"""
	Every inbound address mapped to this instance. Owner-only: per the
	build plan, member invites are deferred to the CLI, and inbound
	addressing is treated with the same "owner, not just any member"
	sensitivity — an agent can work tickets without being able to
	reconfigure where mail routes.
	"""
	inboundAddresses: [InboundAddressInfo!]!
	"""
	Every member of this instance and their role. Owner-only. There is
	deliberately no way to *invite* a member over GraphQL yet — see
	`bin/cli.rs`'s `member add`, which is how an owner bootstraps their
	team today.
	"""
	members: [MemberInfo!]!
}

type MemberInfo {
	user: User!
	role: MembershipRoleType!
}

type MembershipInfo {
	instance: Instance!
	role: MembershipRoleType!
}

"""
`membership.role`, exposed over GraphQL.
"""
enum MembershipRoleType {
	OWNER
	AGENT
}

type MutationRoot {
	"""
	Request an email login code. **Always returns `true`**, whether or not the
	address belongs to a real, enabled user — telling the caller otherwise
	would let anyone enumerate registered emails one guess at a time. Every
	early-return path below exists to preserve that: a bad Turnstile token, an
	unknown/disabled user, and a rate-limit hit are all indistinguishable from
	the outside.
	"""
	requestAuthCode(email: String!, turnstileToken: String): Boolean!
	"""
	Verify an email login code and return an opaque `mtu_` token on success.
	**Returns `null` on every failure path** — expired, wrong code, too many
	attempts, unknown/disabled user — so the response never tells the caller
	which step failed.
	"""
	verifyAuthCode(email: String!, code: String!): String
	"""
	Request a public-submit-form email verification code for `(slug,
	email)`. **Always returns `true`**, same anti-enumeration rationale as
	[`Self::request_auth_code`] — a bad Turnstile token, an unresolvable
	slug, and an instance with public submission disabled are all
	indistinguishable from the outside. The code itself is stored in
	`ephemeral_state` under `kind: "submit_code"` — never in `login_code`;
	see `auth::SUBMIT_CODE_STATE_KIND`'s doc comment for why that
	separation is load-bearing, not incidental.
	"""
	requestSubmitCode(slug: String!, email: String!, turnstileToken: String): Boolean!
	"""
	Verify a public-submit-form code and return a short-lived (15 minute)
	capability token scoped to exactly `(email, instance_id)` on success —
	authorised for `submitTicket` alone, never anything a real user
	session can do. **Returns `null` on every failure path**, mirroring
	[`Self::verify_auth_code`]. Reads and writes `ephemeral_state` under
	`kind: "submit_code"` exclusively — never `login_code` — which is what
	makes it structurally impossible for a code minted by
	[`Self::request_auth_code`] to be accepted here, or vice versa; see
	`tests/submit_code_dynamodb_local.rs` for the regression tests.
	"""
	verifySubmitCode(slug: String!, email: String!, code: String!): String
	"""
	Add an inbound address to an instance. Owner-only. `address` is
	normalized and classified (exact vs. `*@domain` wildcard) by
	`inbound::routing::classify_for_storage`, the same logic `bin/cli.rs`'s
	`address add` uses, so the two can never disagree about what counts as
	a valid address.
	"""
	addInboundAddress(instanceId: ID!, address: String!): InboundAddressInfo!
	"""
	Remove an inbound address from an instance. Owner-only. An address
	that doesn't exist, or that belongs to a different instance, is
	reported the same "not found" either way — so this can't be used to
	probe another instance's addresses.
	"""
	removeInboundAddress(instanceId: ID!, address: String!): Boolean!
	"""
	Open a new ticket from the public submit form. **Requester-token
	only** — the instance and the requester's email come from the token
	(`AuthInfo::Requester`), never from an argument, so this can't be used
	to open a ticket in someone else's name or in an instance the token
	wasn't scoped to. The requester's own submission becomes the ticket's
	first message, stored as `kind: INBOUND` with `fromEmail` set (never
	`authorUserId` — no staff member wrote it).
	
	Sends the requester a brief acknowledgement — with the `Reply-To`
	thread already wired up, so the web form's result lands in their
	inbox ready to reply to. **Best-effort**: see
	`send_system_notification`'s doc comment for why a failure here is
	logged, not surfaced — the ticket itself is the primary effect and
	already exists by the time this runs; failing the mutation over it
	would risk a duplicate submission on retry.
	"""
	submitTicket(subject: String!, body: String!): Ticket!
	"""
	Reply to a ticket as a member (agent/owner): persists the reply
	(`kind: REPLY`), bumps the ticket's activity, builds the outbound
	RFC 5322 message (`crate::outbound`) and sends it via
	`crate::mail::Handler::send_raw`, then stamps the returned message id
	onto the row so a further reply — from either side — threads
	correctly. Attachments are `TODO(step 7)` — no `attachmentKeys`
	argument exists yet.
	
	**On a send failure, this mutation returns `Err` — but the
	`ticket_message` row it already created is *not* rolled back.**
	What the agent typed is the durable record of what they tried to
	say; a transient SES/network failure shouldn't erase it and force a
	retype. But the caller must be told delivery didn't happen — a
	silent success here would let an agent believe a customer received a
	reply that never left the building — so the failure surfaces as a
	mutation error rather than a quietly-`null` `rfcMessageId` on an
	otherwise-successful response. The persisted-but-unsent row (no
	`rfcMessageId`) doubles as the audit trail an operator needs to spot
	and retry a failed send. Contrast `submit_ticket`'s acknowledgement
	and `set_ticket_status`'s notice, both best-effort: those mutations'
	primary effect already succeeded by the time mail is attempted, so a
	failure there is logged, not surfaced.
	"""
	replyToTicket(ticketId: ID!, body: String!): TicketMessage!
	"""
	Add an internal note to a ticket. Member-only, same per-ticket
	authorization as every other ticket mutation. Stored as `kind: NOTE`,
	which `Ticket.messages` filters out for anyone but a member of this
	ticket's instance — see that field's doc comment. **Never emailed,
	now or ever**: this mutation never calls `send_system_notification`
	or `mail::Handler::send_raw`, unlike `submit_ticket` (an
	acknowledgement), `set_ticket_status` (a close/reopen notice), and
	`reply_to_ticket` (the `REPLY` itself) — pinned by
	`tests/outbound_mail_dynamodb_local.rs`'s
	`internal_note_sends_no_mail`.
	"""
	addInternalNote(ticketId: ID!, body: String!): TicketMessage!
	"""
	Change a ticket's status — `OPEN`/`CLOSED`/`DELETED`. Deleting and
	restoring a ticket are just this mutation with `DELETED`/`OPEN`: see
	`db::TicketUpdateShape::SetStatusAndAssignee`'s doc comment for why
	that one variant, not a bespoke delete/restore code path, is what
	keeps the three composite marker attributes consistent. A no-op
	transition (already at the requested status) still succeeds, returning
	the ticket unchanged, rather than erroring — idempotent by design
	(and, since it returns before reaching the mail step below, sends no
	notice either).
	
	A close or a reopen (including restoring a deleted ticket) mails
	requesters/CCs a brief notice — see `outbound::status_notice_body`.
	Deleting one does not: see that function's doc comment.
	"""
	setTicketStatus(ticketId: ID!, status: TicketStatusType!): Ticket!
	"""
	Assign (or, with `userId: null`, unassign) a ticket. The target user,
	when assigning, must themselves be a member of this ticket's
	instance — assigning to an outsider would be silently useless (they
	could never see it via the "assigned to me" filter, which is itself
	instance-scoped). **Sends no mail**: which agent owns a ticket is
	internal bookkeeping the requester has no reason to be notified
	about — see the "Outbound mail" entry in `CLAUDE.md`.
	"""
	assignTicket(ticketId: ID!, userId: ID): Ticket!
	"""
	Add a requester (a "To" recipient) to a ticket. **Sends no mail** —
	see `assign_ticket`'s doc comment and `CLAUDE.md`'s "Outbound mail"
	entry; this mutation, like assignment, is internal bookkeeping.
	"""
	addTicketRequester(ticketId: ID!, email: String!): Ticket!
	"""
	Remove a requester from a ticket. Refuses to remove the last one — a
	ticket must always have someone to reply to. **Sends no mail** — see
	`assign_ticket`'s doc comment.
	"""
	removeTicketRequester(ticketId: ID!, email: String!): Ticket!
	"""
	Add a CC recipient to a ticket. **Sends no mail** — see
	`assign_ticket`'s doc comment.
	"""
	addTicketCc(ticketId: ID!, email: String!): Ticket!
	"""
	Remove a CC recipient from a ticket. Unlike requesters, CCs may go to
	zero — there is no "must keep at least one" rule for them.
	"""
	removeTicketCc(ticketId: ID!, email: String!): Ticket!
	"""
	Revoke the calling token, if there is one to revoke (a `Requester`
	capability token, or an impersonated dev-auth session, has none — this is
	still a harmless `true` for either).
	"""
	logout: Boolean!
	"""
	Start passkey registration for the authenticated user. Returns a JSON
	challenge to pass to the browser's WebAuthn API.
	"""
	beginPasskeyRegistration: PasskeyChallenge!
	"""
	Finish passkey registration: verify the browser response and store the
	credential.
	"""
	finishPasskeyRegistration(challengeId: String!, credentialJson: String!, name: String!): PasskeyInfo!
	"""
	Start a discoverable passkey login (no username required). Returns a JSON
	challenge to pass to the browser's WebAuthn API.
	"""
	beginPasskeyLogin: PasskeyChallenge!
	"""
	Finish passkey login: verify the browser response and return an opaque
	`mtu_` token. `Ok(None)` for anything that means "this credential doesn't
	authenticate" (expired challenge, unknown credential, disabled user) — an
	`Err` is reserved for the request itself being malformed.
	"""
	finishPasskeyLogin(challengeId: String!, credentialJson: String!): String
	"""
	Rename one of the authenticated user's passkeys. A credential belonging
	to someone else reports the same "not found" as a nonexistent one — never
	"belongs to another user" — so this can't be used to probe who owns a
	guessed credential id.
	"""
	renamePasskey(id: String!, name: String!): PasskeyInfo!
	"""
	Delete one of the authenticated user's passkeys. Same ownership-hiding
	"not found" as [`Self::rename_passkey`].
	"""
	deletePasskey(id: String!): Boolean!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type PasskeyChallenge {
	challengeId: String!
	optionsJson: String!
}

"""
Metadata for a stored passkey credential — never the credential itself (no
private key material, no raw `passkey_json`).
"""
type PasskeyInfo {
	id: String!
	name: String!
	createdAt: Int!
	lastUsedAt: Int
}

"""
One instance, exposed publicly and unauthenticated via `publicInstances` —
**only** the name and slug, so nothing else about a tenant (its inbound
addresses, its members, whether it even has any) leaks to an anonymous
caller browsing `/submit`.
"""
type PublicInstance {
	name: String!
	slug: String!
}

type QueryRoot {
	"""
	API build version — the git commit this server was built from.
	"""
	version: String!
	"""
	The authenticated caller's own user record. Guarded on `Authenticated`
	(the only requirement microticket's guard enum offers that fits a "must
	have *some* credential" query), but only a `User` principal actually has
	a record to return — a `Requester` capability token hits the explicit
	error below rather than some confusing "not found".
	"""
	me: User!
	"""
	Resolve a slug (from a URL: `/app/:slug`) to the full instance record.
	Requires *some* authenticated user (checked here, not via a static
	`#[graphql(guard)]`, since the guard's `Member(instance_id)` requirement
	needs an instance id this resolver only learns after resolving the
	slug) and, once resolved, that the caller is actually a member of that
	instance. A slug that doesn't resolve, or that resolves to an instance
	the caller isn't a member of, is reported identically — `None` — so a
	non-member can't use this to probe which slugs exist.
	"""
	instance(slug: String!): Instance
	"""
	Every instance with public ticket submission enabled — the bare
	`/submit` list. Unauthenticated by design (this is how an anonymous
	visitor finds which organisations accept public tickets), and
	deliberately exposes only `name`/`slug`: see [`PublicInstance`]'s doc
	comment for why nothing else about a tenant may leak here.
	"""
	publicInstances: [PublicInstance!]!
	"""
	One of the four ticket listing views, as a Relay connection ordered
	newest-activity-first. `status` defaults to `OPEN`; `DELETED` is
	owner-only (the explicit way to reach a soft-deleted ticket) —
	checked here, not by a static guard, since it depends on the `status`
	argument's value. `assignedTo`, when given, takes priority over
	`status`'s usual GSI choice and queries `instance_assignee` instead,
	narrowed by `status` via a `FilterExpression` when it isn't `ALL` (see
	`db::TicketListFilter`'s doc comment).
	
	**No `search` argument.** The build plan's schema sketch shows one,
	but DynamoDB cannot do a text search without a table scan, and a
	bounded post-filter (fetch a page, then filter in memory) would look
	like search while silently missing matches outside that page — worse
	than not having it. Left out of the schema; see `SCHEMA.md` for the
	same note next to the `ticket` table.
	"""
	tickets(instanceId: ID!, status: TicketStatusFilterType! = OPEN, assignedTo: ID, after: String, before: String, first: Int, last: Int): TicketConnection!
	"""
	Fetch a single ticket by id. Reachable by a member of its instance, or
	by the `Requester` who opened it (matching `instance_id` *and*
	`requester_emails`) — see [`Ticket`]'s doc comment for why a
	`Requester` can reach this at all. Anyone else — including a member of
	a *different* instance, or a requester who isn't on this ticket —
	gets `null`, identically to a nonexistent id, so this can't be used to
	probe which ticket ids exist in another instance.
	"""
	ticket(id: ID!): Ticket
}

type Ticket {
	id: ID!
	instanceId: ID!
	"""
	Dataloaded — see [`TicketMessage::author`]'s doc comment for why this
	matters on a list page (a page of tickets across several instances,
	once cross-instance views exist, would otherwise N+1).
	"""
	instance: Instance!
	number: Int!
	subject: String!
	status: TicketStatusType!
	requesterEmails: [String!]!
	ccEmails: [String!]!
	assigneeUserId: ID
	"""
	Dataloaded — see [`TicketMessage::author`]'s doc comment.
	"""
	assignee: User
	createdAt: Int!
	updatedAt: Int!
	lastActivityAt: Int!
	"""
	Every message on this ticket, oldest first — the thread view's data
	source. **Internal notes (`kind: NOTE`) are filtered out for anyone
	but a member of this ticket's instance** — enforced here, not only in
	the web UI, per the build plan's hard requirement that a note must
	never be visible to a requester. A caller who is neither a member of
	this instance nor the requester who opened this specific ticket gets
	`FORBIDDEN`, not a filtered (possibly empty) list — this field must
	not become a way to probe whether a ticket id exists.
	"""
	messages: [TicketMessage!]!
}

type TicketConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [TicketEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Ticket!]!
}

"""
An edge in a connection.
"""
type TicketEdge {
	"""
	The item at the end of the edge
	"""
	node: Ticket!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type TicketMessage {
	id: ID!
	ticketId: ID!
	kind: TicketMessageKindType!
	authorUserId: ID
	"""
	The message's author, for `reply`/`note` messages — `null` for
	`inbound`/`system`. Dataloaded (see `graphql::dataloader`): a thread
	with several staff replies resolves every author in one `BatchGetItem`,
	not one per message.
	"""
	author: User
	fromEmail: String
	toEmails: [String!]!
	ccEmails: [String!]!
	bodyText: String
	bodyHtml: String
	rfcMessageId: String
	inReplyTo: String
	createdAt: Int!
}

"""
`ticket_message.kind`, exposed over GraphQL.
"""
enum TicketMessageKindType {
	INBOUND
	REPLY
	NOTE
	SYSTEM
}

"""
`tickets(status:)`'s filter — a superset of [`TicketStatusType`] with
`ALL` (every non-deleted ticket, the `instance_visible` GSI). `DELETED` is
the explicit, owner-only way to reach deleted tickets — enforced in the
`tickets` resolver, not by the schema.
"""
enum TicketStatusFilterType {
	OPEN
	CLOSED
	ALL
	DELETED
}

"""
`ticket.status`, exposed over GraphQL. Also `setTicketStatus`'s argument
type — deleting/restoring a ticket is just `setTicketStatus(DELETED)` /
`setTicketStatus(OPEN)`, not a separate mutation, since the three states
are exactly `TicketStatus`'s three variants.
"""
enum TicketStatusType {
	OPEN
	CLOSED
	DELETED
}

type User {
	id: ID!
	email: String!
	name: String!
	enabled: Boolean!
	createdAt: Int!
	accessTime: Int
	"""
	The caller's own registered passkeys. Guarded again even though the only
	current path to a `User` object (`me`) is already guarded — defence in
	depth against a future unguarded resolver that returns a `User` (e.g. an
	admin-facing user lookup) accidentally leaking another user's passkey
	metadata.
	"""
	passkeys: [PasskeyInfo!]!
	"""
	Every instance this user belongs to, and their role in each — the
	instance switcher's data source. Same defence-in-depth guard as
	[`Self::passkeys`], and the same caveat: this reads `self.rec.id`
	directly (not the caller's own id off `AuthInfo`), so it is already
	correct for a future admin-facing "look up any user" query, not just
	`me`.
	"""
	memberships: [MembershipInfo!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
